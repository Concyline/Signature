plugins {
    alias(libs.plugins.android.library)

    id 'maven-publish'
}

android {
    namespace 'br.com.signature'
    compileSdkVersion 36

    publishing {
        singleVariant('release')
    }

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = providers.gradleProperty('group')
                    .getOrElse('com.github.Concyline.Signature')
            artifactId = 'signature'
            version = providers.gradleProperty('version').getOrElse('1.0.4')
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
            }
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.baselibrary
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}